<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Bg colour</title>
    <style>
        body{font-family: Arial;text-align: center; transition: background-color 0.4s;}
        button{padding: 10px 24px; font-size: 16px; margin-top: 40px; cursor: pointer;}
    </style>
    <script>
        var colors=["lightblue","lightgreen","pink","yellow","orange","lavender","lightcoral","Khaki"];
        var index = 0;
        function changeColor(){
            document.body.style.backgroundColor=colors[index];
            document.getElementById("colorName").innerHTML="Current Color :"+colors[index];
            index=(index+1)%colors.length;
        }
    </script>
</head>
<body>
    <h2>BackGround Colour Changer</h2>
    <p id="colorName">Current Color white</p>
    <button onclick="changeColor()">Change Color</button>
</body>
</html>
